<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Error 403: acceso restringido | VISVET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#25313f;
  --mist:#f3f6f7;
  --teal:#2e9c93;
  --amber:#f2b03d;
  --slate:#53616f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Jost","Century Gothic","Avenir Next",system-ui,sans-serif;
  background:var(--mist);
  color:var(--navy);
  min-height:100vh;min-height:100dvh;
  overflow-x:hidden;
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Layout ---------- */
.wrap{
  position:relative;z-index:1;
  max-width:1100px;margin:0 auto;
  min-height:100vh;min-height:100dvh;
  padding:0 24px 20vh;
  display:grid;grid-template-columns:minmax(0,1fr);
  justify-items:center;align-content:start;row-gap:28px;
}
.hang{order:1}
.info{order:2}
@media (min-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:6vw;align-items:start;padding-bottom:16vh}
  .hang{order:2;justify-self:start}
  .info{order:1;justify-self:end;align-self:center;padding-top:10vh}
}

/* ---------- ECG de fondo ---------- */
.ecg{
  position:fixed;left:0;right:0;bottom:5vh;height:90px;z-index:0;
  overflow:hidden;opacity:.5;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
}
.ecg svg{display:block;width:300%;height:100%;animation:ecg 22s linear infinite}
.ecg path{fill:none;stroke:var(--teal);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
@media (max-width:899px){
  .wrap{min-height:0;padding-bottom:28px}
  .ecg{position:relative;bottom:auto;margin:0 0 36px}
}
@keyframes ecg{to{transform:translateX(-50%)}}

/* ---------- Cartel colgante ---------- */
.hang{position:relative;width:min(300px,78vw)}
.hang::before{ /* clavo */
  content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;
  border-radius:50%;background:var(--navy);z-index:2;
}
.swing{
  display:flex;flex-direction:column;align-items:center;
  transform-origin:50% 0;
  animation:swing-in 3.4s ease-in-out .3s both, sway 6s ease-in-out 3.7s infinite;
}
.swing.settled{animation:sway 6s ease-in-out infinite}
.swing.settled.push{animation:push 3s ease-in-out both}
.rope{width:2px;height:clamp(56px,15vh,160px);background:var(--slate);position:relative;z-index:1}
.sign{
  appearance:none;-webkit-appearance:none;border:0;cursor:pointer;font:inherit;color:#fff;
  position:relative;width:100%;margin-top:-14px;
  background:var(--navy);border-radius:18px;overflow:hidden;
  padding:44px 24px 0;text-align:center;
  box-shadow:0 22px 30px -20px rgba(37,49,63,.6);
}
.sign::before{ /* ojal */
  content:"";position:absolute;top:6px;left:50%;width:16px;height:16px;margin-left:-8px;
  border-radius:50%;background:var(--mist);box-shadow:inset 0 0 0 2px #121a24;
}
.sign:focus-visible{outline:3px solid var(--teal);outline-offset:4px}
.sign .num{
  display:block;font-size:clamp(5rem,15vw,7.4rem);font-weight:600;line-height:1;
  letter-spacing:.1em;margin-right:-.1em;
}
.sign .msg{display:block;margin-top:6px;font-size:1.15rem;font-weight:400;letter-spacing:.02em;color:#d6dee6}
.sign .tape{
  display:block;height:30px;margin:24px -24px 0;
  background:repeating-linear-gradient(-45deg,var(--amber) 0 14px,var(--navy) 14px 28px);
}
@keyframes swing-in{
  0%{transform:rotate(24deg)}
  14%{transform:rotate(-18deg)}
  28%{transform:rotate(12deg)}
  42%{transform:rotate(-8deg)}
  56%{transform:rotate(5deg)}
  70%{transform:rotate(-3deg)}
  84%{transform:rotate(1.5deg)}
  100%{transform:rotate(0)}
}
@keyframes push{
  0%{transform:rotate(0)}
  12%{transform:rotate(16deg)}
  27%{transform:rotate(-12deg)}
  42%{transform:rotate(8deg)}
  57%{transform:rotate(-5deg)}
  72%{transform:rotate(3deg)}
  87%{transform:rotate(-1.4deg)}
  100%{transform:rotate(0)}
}
@keyframes sway{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(1.3deg)}
  75%{transform:rotate(-1.3deg)}
}

/* ---------- Logo con ojos ---------- */
.mark{
  position:relative;container-type:inline-size;
  width:min(300px,64vw);aspect-ratio:711/567;
  margin:0 auto 34px;
  animation:logo-in .9s ease-out both;
}
@media (min-width:900px){.mark{margin:0 0 38px}}
.mark img{position:relative;z-index:1;display:block;width:100%;height:auto;user-select:none}
.eye{position:absolute;width:0;height:0;z-index:0}
.pupil{
  position:absolute;left:0;top:0;
  width:var(--d);height:var(--d);margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
  translate:var(--x,0px) var(--y,0px);
  transition:translate .14s ease-out;
}
.dot{
  display:block;width:100%;height:100%;border-radius:50%;background:var(--navy);
  animation:wake .6s ease-out .9s backwards, look 11s ease-in-out 2s infinite, blink 5.5s ease-in-out 2.6s infinite;
}
.mark.tracking .dot{animation:blink 5.5s ease-in-out 1s infinite;translate:0 0}
@keyframes logo-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes wake{from{scale:1 .06}to{scale:1 1}}
@keyframes blink{0%,93%,100%{scale:1 1}96%{scale:1 .06}}
@keyframes look{
  0%,16%{translate:0 0}
  22%,38%{translate:-48% -8%}
  44%,60%{translate:44% 6%}
  66%,80%{translate:6% -46%}
  86%,100%{translate:0 0}
}

/* ---------- Texto ---------- */
.info{max-width:480px;text-align:center;animation:rise .8s ease-out .6s both}
@media (min-width:900px){.info{text-align:left}}
h1{font-size:clamp(1.9rem,4.4vw,2.8rem);font-weight:500;line-height:1.12;letter-spacing:.005em}
.info p{margin-top:16px;max-width:38ch;font-size:1.125rem;line-height:1.55;color:var(--slate);margin-inline:auto}
@media (min-width:900px){.info p{margin-inline:0}}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px;justify-content:center}
@media (min-width:900px){.actions{justify-content:flex-start}}
.btn{
  display:inline-block;font:inherit;font-size:1.05rem;font-weight:500;letter-spacing:.02em;
  padding:14px 26px;border-radius:12px;border:2px solid var(--navy);cursor:pointer;text-decoration:none;
  transition:transform .18s ease,background-color .18s ease,color .18s ease;
}
.btn.primary{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;color:var(--navy)}
.btn:hover{transform:translateY(-2px)}
.btn.primary:hover{background:#18212b}
.btn.ghost:hover{background:var(--navy);color:#fff}
.btn:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<script>
(function () {
  var swing = document.getElementById('swing');
  var sign = document.getElementById('sign');
  var mark = document.getElementById('mark');
  var eyes = Array.prototype.slice.call(document.querySelectorAll('.eye'));

  /* El cartel: tras el balanceo inicial pasa a un vaivén suave; al pulsarlo, se empuja. */
  swing.addEventListener('animationend', function (e) {
    if (e.animationName === 'swing-in') swing.classList.add('settled');
    if (e.animationName === 'push') swing.classList.remove('push');
  });
  sign.addEventListener('click', function () {
    swing.classList.add('settled');
    swing.classList.remove('push');
    void swing.offsetWidth;
    swing.classList.add('push');
  });

  /* Los perros... y el gato, siguen el cursor a través de las gafas. */
  var px = 0, py = 0, queued = false;
  function update() {
    queued = false;
    var scale = mark.clientWidth / 711;
    eyes.forEach(function (eye) {
      var r = eye.getBoundingClientRect();
      var dx = px - (r.left + r.width / 2);
      var dy = py - (r.top + r.height / 2);
      var dist = Math.hypot(dx, dy) || 1;
      var k = Math.min(1, dist / 180);
      var max = parseFloat(eye.getAttribute('data-r')) * scale * k;
      var pupil = eye.firstElementChild;
      pupil.style.setProperty('--x', (dx / dist * max).toFixed(2) + 'px');
      pupil.style.setProperty('--y', (dy / dist * max).toFixed(2) + 'px');
    });
  }
  window.addEventListener('pointermove', function (e) {
    px = e.clientX; py = e.clientY;
    mark.classList.add('tracking');
    if (!queued) { queued = true; requestAnimationFrame(update); }
  }, { passive: true });

  document.getElementById('back').addEventListener('click', function () {
    if (history.length > 1) history.back(); else location.href = '/';
  });
})();
</script>
